<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>得点メモ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>得点メモ</h1>

  <div class="input-area">

    <div class="input-box">
      <label>教科：
      <input type="text" id="subjectInput" placeholder="教科名を入力">
    </div>
</label>
    <div class="input-box">
      <label>点数：
      <input type="number" id="scoreInput" placeholder="点数を入力">
    </div>
  </label>
    <button id="addButton">追加</button>

    <p id="errorMessage"></p>

  </div>

  <table class="score-table">
    <tbody id="scoreTable"></tbody>
  </table>

  <script src="index.js"></script>

</body>
</html>
